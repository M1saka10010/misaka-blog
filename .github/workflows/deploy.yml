name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Generate deployment configuration
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const key of ['D1_DATABASE_ID', 'WORKER_NAME', 'D1_DATABASE_NAME']) {
            if (!process.env[key]?.trim()) throw new Error(`Missing production configuration: ${key}`);
          }
          const config = JSON.parse(readFileSync('wrangler.example.jsonc', 'utf8'));
          config.name = process.env.WORKER_NAME;
          config.d1_databases[0].database_id = process.env.D1_DATABASE_ID;
          config.d1_databases[0].database_name = process.env.D1_DATABASE_NAME;
          writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2));
          NODE
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate public site URL
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.PUBLIC_SITE_URL);
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
            throw new Error('PUBLIC_SITE_URL must be an HTTPS origin without credentials, path, query or fragment');
          }
          NODE
      - name: Migrate, deploy and recover on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node scripts/release.mjs
