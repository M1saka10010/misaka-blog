name: Bootstrap
on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Enter the exact name of the new production Worker'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate with placeholder configuration
        run: |
          cp wrangler.example.jsonc wrangler.jsonc
          npm run typecheck
          npm test
      - name: Initialize a new blog only
        env:
          CONFIRM_WORKER: ${{ inputs.worker_name }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          EXISTING_D1_ID: ${{ secrets.D1_DATABASE_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          OAUTH_CLIENT_ID: ${{ vars.BLOG_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.BLOG_OAUTH_CLIENT_SECRET }}
          ADMIN_LOGIN: ${{ vars.BLOG_ADMIN_LOGIN }}
          ADMIN_ID: ${{ vars.BLOG_ADMIN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/bootstrap.mjs
